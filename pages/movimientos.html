<section class="modulo-cabecera">
    <div>
        <h1>Movimientos</h1>
        <p>Registra tus ingresos y gastos, y consulta el historial de tu dinero.</p>
    </div>
</section>

<div class="rejilla rejilla-formulario">
    <!-- RF-05: registro de ingresos y gastos -->
    <section class="tarjeta">
        <h2>Nuevo movimiento</h2>
        <form class="formulario" action="actions/movimientos.php" method="post">
            <input type="hidden" name="accion" value="crear">

            <div class="rejilla rejilla-2 rejilla-ajustada">
                <div class="campo">
                    <label for="tipo">Tipo de movimiento *</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Selecciona...</option>
                        <option value="ingreso">Ingreso</option>
                        <option value="gasto">Gasto</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="id_categoria">Categoría *</label>
                    <select id="id_categoria" name="id_categoria" required>
                        <option value="">Selecciona...</option>
                    </select>
                </div>

                <div class="campo campo-ancho">
                    <label for="descripcion">Descripción *</label>
                    <input type="text" id="descripcion" name="descripcion" required maxlength="150" placeholder=" ">
                </div>

                <div class="campo">
                    <label for="monto">Monto *</label>
                    <div class="campo-moneda">
                        <span aria-hidden="true">$</span>
                        <input type="number" id="monto" name="monto" min="0.01" step="0.01" required
                               inputmode="decimal" placeholder=" ">
                    </div>
                </div>

                <div class="campo">
                    <label for="fecha">Fecha *</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="campo">
                    <label for="metodo_pago">Método de pago</label>
                    <select id="metodo_pago" name="metodo_pago">
                        <option value="">No aplica</option>
                        <option value="efectivo">Efectivo</option>
                        <option value="tarjeta_debito">Tarjeta de débito</option>
                        <option value="tarjeta_credito">Tarjeta de crédito</option>
                        <option value="transferencia">Transferencia</option>
                    </select>
                </div>

                <div class="campo campo-ancho">
                    <label for="notas">Notas opcionales</label>
                    <textarea id="notas" name="notas" rows="2" maxlength="500" placeholder=" "></textarea>
                </div>
            </div>

            <div class="acciones-formulario">
                <button type="reset" class="btn btn-fantasma">Limpiar</button>
                <button type="submit" class="btn btn-primario">Guardar movimiento</button>
            </div>
        </form>
    </section>

    <!-- RF-06: consulta del historial -->
    <section class="tarjeta">
        <h2>Historial</h2>
        <form class="filtros" id="filtros-movimientos">
            <div class="campo">
                <label for="filtro-buscar">Buscar</label>
                <input type="search" id="filtro-buscar" placeholder=" ">
            </div>
            <div class="campo">
                <label for="filtro-tipo">Tipo</label>
                <select id="filtro-tipo">
                    <option value="">Todos</option>
                    <option value="ingreso">Ingresos</option>
                    <option value="gasto">Gastos</option>
                </select>
            </div>
            <div class="campo">
                <label for="filtro-mes">Mes</label>
                <input type="month" id="filtro-mes">
            </div>
        </form>

        <div class="tabla-contenedor">
            <table class="tabla" id="tabla-movimientos">
                <thead>
                    <tr>
                        <th scope="col">Fecha</th>
                        <th scope="col">Tipo</th>
                        <th scope="col">Categoría</th>
                        <th scope="col">Descripción</th>
                        <th scope="col">Método</th>
                        <th scope="col" class="num">Monto</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>

        <div class="estado-vacio">
            <h3>Sin movimientos</h3>
            <p>Sin movimientos registrados. Registra uno con el formulario.</p>
        </div>
    </section>
</div>
