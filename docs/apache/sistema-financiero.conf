<VirtualHost *:80>
    ServerName sistema-financiero.test
    DocumentRoot "C:/xampp/htdocs/MiBalanceTracker/public"

    <Directory "C:/xampp/htdocs/MiBalanceTracker/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/sistema-financiero-error.log"
    CustomLog "logs/sistema-financiero-access.log" common
</VirtualHost>
